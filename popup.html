<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GlassCase</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">G</div>
      <div class="brand-copy"><h1>GlassCase</h1><p>Gmail Capitalization Generator</p></div>
      <span class="version">v1.0</span>
    </header>
    <section class="intro">
      <p class="eyebrow">WRITE WITH CLARITY</p>
      <h2>Make every message <span>look polished.</span></h2>
      <p class="subtext">Paste your text, choose a style, then copy it into Gmail.</p>
    </section>
    <label class="field-label" for="sourceText">YOUR TEXT <span id="charCount">0 characters</span></label>
    <textarea id="sourceText" spellcheck="true" placeholder="hey there, i hope you are doing well..."></textarea>
    <div class="section-row"><span class="field-label">CAPITALIZATION STYLE</span><span class="hint">Choose one</span></div>
    <div class="styles" role="group" aria-label="Capitalization style">
      <button class="style-btn active" data-mode="sentence" type="button"><span class="style-icon">Aa</span><span><b>Sentence case</b><small>Natural writing</small></span></button>
      <button class="style-btn" data-mode="title" type="button"><span class="style-icon">Ab</span><span><b>Title Case</b><small>Headings & subjects</small></span></button>
      <button class="style-btn" data-mode="upper" type="button"><span class="style-icon">AA</span><span><b>UPPERCASE</b><small>All letters up</small></span></button>
      <button class="style-btn" data-mode="lower" type="button"><span class="style-icon">aa</span><span><b>lowercase</b><small>All letters down</small></span></button>
    </div>
    <section class="preview-wrap">
      <div class="preview-head"><span class="field-label">LIVE PREVIEW</span><span class="live-dot"></span></div>
      <div id="preview" class="preview empty" aria-live="polite">Your formatted text will appear here.</div>
    </section>
    <div class="actions"><button id="copyBtn" class="primary-btn" type="button">▢ &nbsp;Copy formatted text</button><button id="clearBtn" class="clear-btn" type="button">Clear</button></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <footer><span class="footer-dot"></span> Runs locally · Your text stays in this popup</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
